
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'jaffle_shop'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `source-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
    - "target"
    - "dbt_modules"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the jaffle_shop project
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  jaffle_shop:
    staging:
      +materialized: view
    marts:
      +materialized: table
    # The pre-refactor query, kept as a stable baseline for the audit analyses.
    # A table, not a view, so auditing doesn't re-run the legacy SQL every time.
    legacy:
      +materialized: table
    python_demo:
      # Disabled by the Snowflake -> BigQuery migration, 2026-09-01. This is a capability
      # loss, not a syntax problem: Snowflake ran dbt Python models natively on Snowpark,
      # whereas BigQuery has no in-warehouse Python and dbt submits the model to **Dataproc
      # Serverless**, which needs compute_region + gcs_bucket + a staging bucket and is not
      # covered by the free tier. Failure mode if left enabled:
      #   Configuration Error: Need to supply compute_region in profile to submit python job
      # Paying for a Dataproc cluster to look up US public holidays is the wrong trade, so
      # the model is disabled rather than deleted -- is_holiday_2024.py is untouched and
      # removing these two lines restores it once a compute_region exists.
      # date_spine stays enabled: it is plain SQL and other work may still reference it.
      is_holiday_2024:
        +enabled: false
