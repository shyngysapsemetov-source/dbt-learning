sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    # BigQuery has project.dataset.table where Snowflake had database.schema.table, one
    # level shallower, so raw.jaffle_shop collapses to the dataset raw_jaffle_shop.
    # `database:` is deliberately omitted rather than set: dbt defaults it to the target's
    # project, which keeps the GCP project id out of this public repo and lets the same
    # source resolve in any project (dev, a colleague's, dbt Cloud) without an edit.
    schema: raw_jaffle_shop
    tables:
      - name: customers
        description: Raw customers data
        columns: 
          - name: id
            description: the primary key
            data_tests:
              - unique
              - not_null
      - name: orders
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
          
          loaded_at_field: _etl_loaded_at