sources:
  - name: stripe
    # See _src_jaffle_shop.yml: dataset instead of database.schema, and `database:` omitted
    # so it inherits the target's project rather than hardcoding it in a public repo.
    schema: raw_stripe
    tables:
      - name: payment
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}