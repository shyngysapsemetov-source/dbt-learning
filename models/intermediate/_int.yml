models:
  - name: int_order_payments
    description: >
      Non-failed payment totals rolled up to one row per order. This is the only
      incremental model in the project, because it is the only one whose group key
      (order_id) is also its merge key: an order's total depends solely on that
      order's own payments, so recomputing a touched order is always correct
      regardless of the order in which batches arrive.
    config:
      materialized: incremental
      unique_key: order_id
      incremental_strategy: merge
      # Never drop this. The default 'ignore' silently omits new columns from the
      # insert, leaving the table without them; an unqualified reference to a missing
      # column then binds to the outer query and Snowflake reports a correlated
      # aggregate instead of a missing column. That is what broke fct_orders.
      on_schema_change: sync_all_columns
    columns:
      - name: order_id
        description: Primary key. Foreign key to stg_jaffle_shop_orders.
        data_tests:
        - unique
        - not_null

      - name: payment_finalized_date
        description: >
          Date of the order's most recent non-failed payment. NULL when every payment
          on the order failed.

      - name: total_order_amount
        description: >
          Sum of non-failed payment amounts for the order, in USD. NULL when every
          payment on the order failed.

      - name: _batched_at
        description: >
          Latest source load timestamp across the order's payments. Drives the
          incremental watermark, so it must be non-null for the next run to be correct.
        data_tests:
        - not_null

  - name: int_orders__pivoted
    description: >
      Successful payment amounts pivoted from one row per payment to one column per
      payment method. The method list is a Jinja variable at the top of the model, so
      adding a method is a one-word change rather than a new hand-written case
      expression. A column is NULL, not zero, when the order has no payment of that
      method — nothing here coalesces, so downstream consumers decide.
    columns:
      - name: order_id
        description: Primary key. Foreign key to stg_jaffle_shop_orders.
        data_tests:
        - unique
        - not_null

      - name: credit_card_amount
        description: Successful credit card payments for the order, in USD.

      - name: coupon_amount
        description: Successful coupon payments for the order, in USD.

      - name: bank_transfer_amount
        description: Successful bank transfer payments for the order, in USD.

      - name: gift_card_amount
        description: Successful gift card payments for the order, in USD.
